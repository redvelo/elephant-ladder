[package]
name = "elephant-ladder-conformance"
version = "0.1.0"
edition = "2024"
description = "Fixture runner and conformance evidence for Elephant Ladder"
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = "0.8"
blake3 = { version = "1", features = ["neon"] }
elephant-ladder-native-host = { path = "../native-host" }
epub-navigator = { path = "../../../../navigator/crates/epub-navigator" }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
